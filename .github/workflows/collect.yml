name: 자동 수집

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 오전 6시 (한국 시간): 전체 수집
    - cron: "0 0,3,6,9,12,15 * * *"   # 오전 9시~자정까지 3시간마다: 유머만 갱신
  workflow_dispatch:        # Actions 탭에서 "Run workflow"로 바로 수집
    inputs:
      export_only:
        description: "새로 수집하지 않고, 모아둔 자료로 웹페이지만 다시 만들기 (빠름)"
        type: boolean
        default: false
      humor_only:
        description: "유머만 새로 수집하기"
        type: boolean
        default: false
      games_only:
        description: "게임 검색 목록만 채우기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 대기 중에 앞 수집이 올린 최신 결과에서 시작
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 수집 + 웹페이지 데이터 만들기
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # 없으면 중복 검사만 건너뜀
        run: |
          if [ "${{ inputs.games_only }}" = "true" ]; then python build_site.py --games-only
          elif [ "${{ inputs.export_only }}" = "true" ]; then python build_site.py --export-only
          elif [ "${{ inputs.humor_only }}" = "true" ] || { [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "0 21 * * *" ]; }; then python build_site.py --humor-only
          else python build_site.py; fi
      - name: 결과 저장
        run: |
          git config user.name "collector-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "자동 수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git pull --rebase -X theirs origin main   # 겹치면 이번 수집 결과를 우선
          git push origin HEAD:main
