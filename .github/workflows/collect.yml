name: 자동 수집

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 오전 6시 (한국 시간)
  workflow_dispatch:        # Actions 탭에서 "Run workflow"로 바로 수집

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 수집 + 웹페이지 데이터 만들기
        run: python build_site.py
      - name: 결과 저장
        run: |
          git config user.name "collector-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "자동 수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push origin HEAD:main
