name: probe
on: [push]
jobs:
  p:
    if: contains(github.event.head_commit.message, 'probe')
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          W=https://steam-search.yub815.workers.dev
          curl -s "$W/app?id=5266240" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('videos'),d.get('images')[:1],d.get('desc'))"
          V=$(curl -s "$W/app?id=5266240" | python3 -c "import json,sys;print((json.load(sys.stdin).get('videos') or [''])[0])")
          echo "video=$V"
          curl -s -o v.mp4 -w "media %{http_code} %{size_download}\n" "$W/media?u=$V"
          K=$(python3 -c "import re,sys;m=re.search(r'apps/(\d+)/extras/([^/?]+)\.mp4','$V');print(m.group(1)+'_'+re.sub(r'[^\w-]','',m.group(2))[:80] if m else 'NOMATCH')")
          echo "key=$K"; curl -s -o /dev/null -w "gif %{http_code} %{size_download}\n" "$W/gif/$K.gif"
          curl -s -X POST -H 'Origin: https://yub815.github.io' -H 'Content-Type: application/json' -d '{"name":"Potato Please","desc":"1인칭 감자 깎기 게임"}' "$W/write"; echo
          ffprobe -v error -show_entries format=duration:stream=width,height -of compact v.mp4 || true
