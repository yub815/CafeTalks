name: probe
on: [push]
jobs:
  p:
    if: contains(github.event.head_commit.message, 'probe')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          curl -s -w " %{http_code}\n" https://steam-search.yub815.workers.dev/gif/1_test.gif
          curl -s https://steam-search.yub815.workers.dev/ping; echo
          printf 'GIF89a-test' > t.gif
          curl -s -w " %{http_code}\n" -X POST -H 'Origin: https://yub815.github.io' --data-binary @t.gif https://steam-search.yub815.workers.dev/gif/1_test.gif
          curl -s -w " %{http_code}\n" https://steam-search.yub815.workers.dev/gif/1_test.gif
      - run: pip install -q -r requirements.txt && python anime_ratings.py
        env: {ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"}
