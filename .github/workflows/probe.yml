name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > p.py <<'PY'
          import json,urllib.request,urllib.parse,collections
          UA={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/130"}
          def g(u): return json.load(urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=20))
          # find category ids
          cats=[];nxt=None
          for _ in range(6):
              q="size=50"+("&"+urllib.parse.urlencode({"concurrentUserCount":nxt["concurrentUserCount"],"openLiveCount":nxt["openLiveCount"],"categoryId":nxt["categoryId"]}) if nxt else "")
              c=g("https://api.chzzk.naver.com/service/v1/categories/live?"+q)["content"]; cats+=c["data"]; nxt=c["page"]["next"]
              if not nxt: break
          for x in cats:
              if "종합" in x["categoryValue"] or x["categoryId"] in("talk",): print(x["categoryType"],x["categoryId"],x["categoryValue"],x["openLiveCount"],x["concurrentUserCount"])
          print(len(cats))
          for cid in ["Jonghap_Game","jonghap_game"]:
              pass
          for x in cats:
              if "종합" in x["categoryValue"]:
                  u=f"https://api.chzzk.naver.com/service/v2/categories/{x['categoryType']}/{x['categoryId']}/lives?size=50"
                  try:
                      d=g(u)["content"]; print(u, list(d.keys()))
                      for l in d["data"][:50]: print(l["concurrentUserCount"],"|",l["liveTitle"],"|",l.get("tags"))
                  except Exception as e: print(u,e)
          # search
          for kw in ["에스노탐정","80억분의 1","버튜버로 살아가기","에이징커브"]:
              u="https://api.chzzk.naver.com/service/v1/search/lives?"+urllib.parse.urlencode({"keyword":kw,"size":10})
              try:
                  d=g(u)["content"]; print("SEARCH",kw,len(d.get("data",[])),[ (x["live"]["liveTitle"],x["live"]["concurrentUserCount"]) for x in d.get("data",[])][:5])
              except Exception as e: print(kw,e)
          PY
          python3 p.py
