name: probe
on: [push]
jobs:
  p:
    if: contains(github.event.head_commit.message, 'probe')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - shell: bash {0}
        run: |
          pip install -q -r requirements.txt
          curl -s https://graphql.anilist.co -H 'Content-Type: application/json' -d '{"query":"{a:Page(perPage:5){media(search:\"Steel Ball Run\",type:ANIME){id popularity format countryOfOrigin title{romaji english native} synonyms startDate{year month} nextAiringEpisode{episode}}} b:Page(perPage:5){media(search:\"Seitokai ni mo Ana wa Aru\",type:ANIME){id popularity format title{romaji english native} synonyms}}}"}'; echo
          curl -s https://datasets.imdbws.com/title.basics.tsv.gz | gunzip | grep -iE "	(JoJo|Seitokai|Student Council|Steel Ball)" | grep -iE "steel|jojo no|jojo's bizarre|seitokai|student council" | grep -E "tvSeries|tvMini" | head -20
