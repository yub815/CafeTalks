name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/3318210/extras/2fc6c22ff439969062cb8e0b0c118c7a
          for e in gif mp4 webm; do echo "== $e"; curl -sS -o /dev/null -w "%{http_code} %{content_type} %{size_download}\n" -H "Origin: https://yub815.github.io" -D h.txt "$B.$e"; grep -i "access-control" h.txt; done
          which ffmpeg
