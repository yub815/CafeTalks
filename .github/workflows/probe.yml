name: probe
on: [push]
jobs:
  p:
    if: contains(github.event.head_commit.message, 'probe')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash {0}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: pip -q install -r requirements.txt; python probe_ig.py
