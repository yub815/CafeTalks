name: probe
on: [push]
jobs:
  p:
    if: contains(github.event.head_commit.message, 'probe')
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
          for u in \
            'https://cu.bgfretail.com/product/product.do?category=product&depth2=4&sf=N' \
            'https://cu.bgfretail.com/product/productAjax.do' \
            'http://gs25.gsretail.com/gscvs/ko/products/youus-freshfood' \
            'https://www.7-eleven.co.kr/product/presentList.asp' \
            'https://www.7-eleven.co.kr/product/7prodList.asp' \
            'https://www.7-eleven.co.kr/event/eventList.asp' \
            'https://www.emart24.co.kr/goods/ff' \
            'https://www.emart24.co.kr/event/ing' \
            'https://www.crown.co.kr/product/product_list.asp' \
            'https://www.crown.co.kr/' \
            'https://www.lottewellfood.com/' \
            'https://www.orionworld.com/' \
            'https://www.nongshim.com/promotion/new' \
            'https://www.bing.com/news/search?q=%ED%81%AC%EB%9D%BC%EC%9A%B4%EC%A0%9C%EA%B3%BC+%EC%8B%A0%EC%A0%9C%ED%92%88&format=rss' \
            'https://www.bing.com/news/search?q=%EC%84%B8%EB%B8%90%EC%9D%BC%EB%A0%88%EB%B8%90+%EC%8B%A0%EC%83%81&format=rss' \
            'https://search.naver.com/search.naver?where=news&query=%ED%81%AC%EB%9D%BC%EC%9A%B4+%EB%A0%88%EB%93%9C%ED%95%98%EC%9E%84' \
            ; do
            f=$(mktemp); c=$(curl -sL -m 20 -A "$UA" -o $f -w '%{http_code} %{size_download} %{url_effective}' "$u")
            echo "== $c"; echo "   imgs=$(grep -o '<img' $f | wc -l) items=$(grep -o '<item>' $f | wc -l)"
            grep -o '<title>[^<]*' $f | head -6 | sed 's/^/   /'
          done
