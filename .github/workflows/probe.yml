          echo "== steam result"; curl -sS "https://store.steampowered.com/api/storesearch/?term=%ED%8C%8C%EB%A9%B8%EC%9D%98%20%EC%98%A4%ED%83%80%EC%BF%A0&l=koreana&cc=KR" | head -c 800
