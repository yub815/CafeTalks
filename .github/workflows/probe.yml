name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "== search"; curl -s -m 30 -G "https://api.microlink.io/" --data-urlencode "url=https://store.steampowered.com/search/?term=liars bar&l=koreana&cc=KR" \
            --data-urlencode "data.games.selectorAll=#search_resultsRows > a" --data-urlencode "data.games.attr.url.attr=href" \
            --data-urlencode "data.games.attr.title.selector=.title" --data-urlencode "data.games.attr.img.selector=img" --data-urlencode "data.games.attr.img.attr=src" --data-urlencode "meta=false" | cut -c1-900
          echo; echo "== app"; curl -s -m 30 -G "https://api.microlink.io/" --data-urlencode "url=https://store.steampowered.com/app/3097560/?l=koreana" \
            --data-urlencode "data.desc.selector=.game_description_snippet" --data-urlencode "data.name.selector=#appHubAppName" \
            --data-urlencode "data.shots.selectorAll=.highlight_screenshot_link" --data-urlencode "data.shots.attr=href" --data-urlencode "meta=false" | cut -c1-1200
          echo; echo "== ratelimit"; curl -s -m 20 -D - -o /dev/null "https://api.microlink.io/?url=https://neal.fun" | grep -i rate-limit
