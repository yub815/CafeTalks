name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -q requests beautifulsoup4
          python - <<'PY'
          import requests, re
          from bs4 import BeautifulSoup
          H={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36","Accept-Language":"ko-KR,ko;q=0.9"}
          r=requests.get("https://web.humoruniv.com/board/humor/list.html?table=pds&st=day",headers=H,timeout=15); r.encoding="cp949"
          s=BeautifulSoup(r.text,"html.parser")
          tr=s.select("tr[id^=li_chk_pds]")
          print("ROWS",len(tr))
          for t in tr[:3]: print("TDS|",[(td.get("class"),td.get_text(" ",strip=True)[:40]) for td in t.select("td")])
          u="https://web.humoruniv.com/board/humor/"+tr[0].select_one("a[href*=read]")["href"]
          r2=requests.get(u,headers=H,timeout=15); r2.encoding="cp949"; s2=BeautifulSoup(r2.text,"html.parser")
          print("POST",u,r2.status_code)
          for sel in ["#wrap_copy","#cnts","div.body_editor","#wrap_body","div#wrap_cnts","span#ai_cm_content"]:
              b=s2.select_one(sel); print("SEL",sel,bool(b),len(b.select("img")) if b else 0,(b.get_text(" ",strip=True)[:150] if b else ""))
          imgs=[i.get("src") for i in s2.select("img") if "down.humoruniv" in (i.get("src") or "")]
          print("IMGS",imgs[:6])
          for i in s2.select("img"):
              if "down.humoruniv" in (i.get("src") or ""):
                  p=i
                  for _ in range(4): p=p.parent
                  print("ANCESTORS",[ (a.name,a.get("id"),a.get("class")) for a in list(i.parents)[:8]]); break
          PY
