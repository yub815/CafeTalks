name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          O="Origin: https://yub815.github.io"
          T='https://store.steampowered.com/api/storesearch/?term=%EB%9D%BC%EC%9D%B4%EC%96%B4%EC%8A%A4%20%EB%B0%94&l=koreana&cc=KR'
          for P in "https://api.allorigins.win/raw?url=" "https://corsproxy.io/?url=" "https://api.codetabs.com/v1/proxy/?quest=" "https://cors.eu.org/"; do
            echo "== $P"; curl -s -m 20 -D - -H "$O" "$P$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe='') if 'eu.org' not in sys.argv[2] else sys.argv[1])" "$T" "$P")" | grep -iE "^HTTP|access-control-allow-origin|^\{" | cut -c1-250
          done
          echo "== appdetails via allorigins"; curl -s -m 20 "https://api.allorigins.win/raw?url=$(python3 -c "import urllib.parse;print(urllib.parse.quote('https://store.steampowered.com/api/appdetails?appids=3097560&l=koreana&cc=kr',safe=''))")" | cut -c1-200
