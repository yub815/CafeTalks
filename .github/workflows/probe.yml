name: probe
on: [push]
jobs:
  p:
    if: contains(github.event.head_commit.message, 'probe')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - shell: bash {0}
        run: |
          pip install -q -r requirements.txt
          curl -s https://datasets.imdbws.com/title.episode.tsv.gz | gunzip | grep -P "\ttt38268282\t" | sort -t$'\t' -k3,3n -k4,4n > sbr.tsv
          curl -s https://datasets.imdbws.com/title.ratings.tsv.gz | gunzip > r.tsv
          while IFS=$'\t' read a b c d; do echo "SBR $c $d $a $(grep -P "^$a\t" r.tsv | cut -f2,3)"; done < sbr.tsv
          ANIME_DEBUG=1 python anime_ratings.py | grep -E "DBG|애니"
        env: {ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"}
