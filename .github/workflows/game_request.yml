name: 게임 요청

# 사이트의 '게임 요청' 버튼 → 제목이 "게임 요청: 이름"인 이슈가 열리면 실행
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  add:
    # 저장소 주인이 연 요청만 처리
    if: startsWith(github.event.issue.title, '게임 요청') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 스팀에서 찾아서 넣기
        id: add
        env:
          TITLE: ${{ github.event.issue.title }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          NAME="${TITLE#*:}"
          set +e
          python request_game.py "$NAME" > result.txt
          ok=$?
          set -e
          cat result.txt
          if [ $ok -eq 0 ]; then python build_site.py --export-only; fi
      - name: 결과 저장
        run: |
          git config user.name "collector-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "게임 요청 반영"
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
      - name: 요청 닫기
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          MSG="$(cat result.txt 2>/dev/null || echo '처리 중 오류가 났어요. Actions 기록을 확인해 주세요.')"
          gh issue close "$NUM" --repo "${{ github.repository }}" --comment "$MSG (사이트는 1~2분 뒤 새로고침)"
